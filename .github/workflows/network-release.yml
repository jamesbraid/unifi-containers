name: network release

on:
  push:
    tags: ["network/*"]

# GHCR pushes use the workflow token: GHCR does not honor GitHub App
# installation tokens for user-owned packages ("installation not allowed
# to Write organization package"). The App handles git/PR writes only.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jamesbraid/unifi-network

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the plan compares against every release tag

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Fails here, at the first step, when the tag disagrees with the pinned
      # artifact — before anything is built, let alone pushed.
      - name: Plan the release
        id: ver
        run: uv run -p 3.13 unifi-containers release-plan "$GITHUB_REF_NAME" --github >> "$GITHUB_OUTPUT"

      # Plain `docker build`, and before buildx is set up: the sim layer must
      # resolve its base from the local daemon, which the buildx container
      # driver cannot do.
      #
      # Root context for the base: the shared python package lives at src/ and
      # COPY cannot reach outside its context. sim keeps its small context — it
      # inherits the package and PYTHONPATH from the base image.
      - name: Build base and sim (amd64) for the health gate
        run: |
          docker build -f network/Dockerfile -t unifi-network:gate \
            --build-arg VERSION="${{ steps.ver.outputs.build }}" \
            --build-arg REVISION="${GITHUB_SHA}" .
          docker build --build-arg BASE_IMAGE=unifi-network:gate -t unifi-network:simgate network/sim/

      - name: Shipped package imports on the image's own interpreter
        run: docker run --rm --entrypoint /usr/bin/python3 unifi-network:gate -m unifi_runtime.selfcheck

      # Pre-push, so a broken image never publishes. The suite covers the API
      # login and mongod's clean shutdown, and tears its containers down even
      # when an assertion fails.
      - name: Health gate — a broken image never publishes
        env:
          UNIFI_TEST_NETWORK_IMAGE: unifi-network:gate
          UNIFI_TEST_NETWORK_SIM_IMAGE: unifi-network:simgate
        # `not seeded`: that image cannot exist yet — seed.tgz comes from the
        # pushed base digest — and it is gated separately once it does.
        run: uv run -p 3.13 --extra test pytest tests/integration -m integration -k "network and not seeded"

      # An older build's workflow re-run must publish nothing: every name now
      # slides, so pushing would drag it back onto an older image.
      - name: Refuse to publish a superseded build
        if: steps.ver.outputs.publish != 'true'
        run: echo "::notice::${GITHUB_REF_NAME} is not the newest build of its upstream version; nothing to publish"

      - uses: docker/setup-qemu-action@v3
        if: steps.ver.outputs.publish == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.ver.outputs.publish == 'true'

      - name: Log in to GHCR
        if: steps.ver.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push base image (multi-arch)
        if: steps.ver.outputs.publish == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: network/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.push_base }}
          build-args: |
            VERSION=${{ steps.ver.outputs.build }}
            REVISION=${{ github.sha }}

      - name: Push sim image (multi-arch, from the pushed base digest)
        if: steps.ver.outputs.publish == 'true'
        id: pushsim
        uses: docker/build-push-action@v6
        with:
          context: network/sim
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.push_sim }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      # The wizard run is the check: a wizard that does not complete fails here
      # rather than snapshotting a half-seeded volume.
      - name: Produce seed data (boot the pushed digest, complete the wizard)
        if: steps.ver.outputs.publish == 'true'
        run: uv run -p 3.13 unifi-containers make-seed "$IMAGE@${{ steps.push.outputs.digest }}"

      # The seeded image cannot be gated with the others: seed.tgz is produced
      # from the pushed base digest, so the earliest it can exist is here. Build
      # it for amd64 only and prove the baked admin authenticates before the
      # multi-arch push.
      - name: Health gate the seeded image
        if: steps.ver.outputs.publish == 'true'
        env:
          UNIFI_TEST_NETWORK_SEEDED_IMAGE: unifi-network:seedgate
        run: |
          docker buildx build --load --platform linux/amd64 \
            --build-arg "BASE_IMAGE=$IMAGE@${{ steps.push.outputs.digest }}" \
            -t unifi-network:seedgate network/seeded
          uv run -p 3.13 --extra test \
            pytest tests/integration -m integration -k seeded_variant

      - name: Push seeded image (multi-arch, from the pushed base digest)
        if: steps.ver.outputs.publish == 'true'
        id: pushseeded
        uses: docker/build-push-action@v6
        with:
          context: network/seeded
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.ver.outputs.push_seeded }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

      # Which tags move was decided by release-plan; this only applies it.
      - name: Move the sliding tags
        if: steps.ver.outputs.publish == 'true'
        run: |
          uv run -p 3.13 unifi-containers slide-tags --image "$IMAGE" \
            --tags "${{ steps.ver.outputs.globals }}" \
            --base "${{ steps.push.outputs.digest }}" \
            --sim "${{ steps.pushsim.outputs.digest }}" \
            --seeded "${{ steps.pushseeded.outputs.digest }}"
