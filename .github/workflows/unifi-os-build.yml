name: unifi-os build

on:
  pull_request:
    paths: ["unifi-os/**", ".github/workflows/unifi-os-build.yml", ".github/scripts/**"]
  push:
    branches: [main]
    paths: ["unifi-os/**", ".github/workflows/unifi-os-build.yml", ".github/scripts/**"]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Extract UOS base image (amd64, pinned + sha256-verified)
        run: ./unifi-os/extract-uos.sh amd64

      - name: Build base image
        run: |
          . ./unifi-os/pins.env
          docker build --build-arg UOS_VERSION="$UOS_VERSION" -t unifi-os-server:ci unifi-os/

      - name: Build sim and seeded images
        run: |
          docker build --build-arg BASE_IMAGE=unifi-os-server:ci -t unifi-os-server:ci-sim unifi-os/sim/
          docker build --build-arg BASE_IMAGE=unifi-os-server:ci -t unifi-os-server:ci-seeded unifi-os/seeded/

      - name: Boot and health-gate sim image (Network App demo — admin/admin + devices on 7443)
        run: |
          ./.github/scripts/run-uos.sh uos-ci-sim unifi-os-server:ci-sim
          ./scripts/wait-healthy.py uos-ci-sim 900
          # The sim variant runs the base entrypoint with the seed flags
          # unset, so it doubles as the proof that the key seed stays inert.
          ./scripts/assert-uos-api-key.py uos-ci-sim --expect-absent
          docker rm -f uos-ci-sim

      - name: Boot and health-gate seeded image (UOS-native owner on :443)
        run: |
          ./.github/scripts/run-uos.sh uos-ci-seeded unifi-os-server:ci-seeded
          ./scripts/wait-healthy.py uos-ci-seeded 900
          # Healthy already proves the key authenticates; this also proves a
          # bogus key is rejected and that a restart reuses the key.
          ./scripts/assert-uos-api-key.py uos-ci-seeded
          docker rm -f uos-ci-seeded
