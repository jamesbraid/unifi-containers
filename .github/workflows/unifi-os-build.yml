name: unifi-os build

# The path lists are duplicated rather than shared with a YAML anchor:
# GitHub Actions does not reliably honour anchors in workflow files, and a
# silently-ignored trigger here means a broken image ships.
#
# src/unifi_runtime/** is load-bearing: the entrypoint, seed and
# healthcheck now live in the shared package and are COPY'd into the image,
# so a change there changes the image without touching unifi-os/.
on:
  pull_request:
    paths:
      - "unifi-os/**"
      - "src/unifi_runtime/**"
      - "src/unifi_containers/**"
      - ".github/workflows/unifi-os-build.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/integration/**"
      - "tests/conftest.py"
  push:
    branches: [main]
    paths:
      - "unifi-os/**"
      - "src/unifi_runtime/**"
      - "src/unifi_containers/**"
      - ".github/workflows/unifi-os-build.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/integration/**"
      - "tests/conftest.py"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Extract UOS base image (amd64, pinned + sha256-verified)
        run: uv run -p 3.13 unifi-containers extract-uos amd64

      # Root build context: the shared package lives at src/ and COPY cannot
      # reach outside its context. The sim/seeded variants keep their small
      # contexts — they inherit the package and PYTHONPATH from the base.
      - name: Build base image
        run: |
          . ./unifi-os/pins.env
          docker build -f unifi-os/Dockerfile --build-arg UOS_VERSION="$UOS_VERSION" \
            --build-arg UOS_APP_VERSION="$UOS_APP_VERSION" -t unifi-os-server:ci .

      - name: Build sim and seeded images
        run: |
          docker build --build-arg BASE_IMAGE=unifi-os-server:ci -t unifi-os-server:ci-sim unifi-os/sim/
          docker build --build-arg BASE_IMAGE=unifi-os-server:ci -t unifi-os-server:ci-seeded unifi-os/seeded/

      # The tests run on uv's python-build-standalone 3.9; this runs on the
      # image's own Debian 3.9.2. It catches a module that will not import
      # there at all — the failure the test suite structurally cannot see.
      - name: Shipped package imports on the image's own interpreter
        run: docker run --rm --entrypoint /usr/bin/python3 unifi-os-server:ci -m unifi_runtime.selfcheck

      # The entrypoint feeds an undocumented vendor interface — the files
      # ubnt-tools reads — and Ubiquiti moves it between releases (5.1.21 read
      # /usr/lib/version, 5.1.37 reads /usr/lib/app_model). This fails in
      # seconds and names the file; without it the drift surfaces as an
      # integration boot timing out half an hour later with empty logs.
      - name: Vendor tooling can read the stamps
        run: docker run --rm --entrypoint /usr/bin/python3 unifi-os-server:ci -m unifi_runtime.vendorcheck

      # One step, and the fixtures tear their containers down even when an
      # assertion fails -- which the previous boot/wait/assert/rm sequence could
      # not, because `docker rm -f` was its own step and got skipped.
      #
      # `-k uos`, or the network half of the suite runs here too and boots a
      # published unifi-network image this job did not build.
      - name: Integration suite against the images just built
        env:
          UNIFI_TEST_UOS_IMAGE: unifi-os-server:ci
          UNIFI_TEST_UOS_SIM_IMAGE: unifi-os-server:ci-sim
          UNIFI_TEST_UOS_SEEDED_IMAGE: unifi-os-server:ci-seeded
        run: uv run -p 3.13 --extra test pytest tests/integration -m integration -k uos

  # A red run must page, not wait to be discovered: the 5.1.37 release
  # failure sat unnoticed for nine days until a consumer tripped over it.
  # Harmless while the PUSHOVER_* secrets are unset — the step says so and
  # exits clean.
  notify-failure:
    needs: [build-test]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          USER: ${{ secrets.PUSHOVER_USER }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ github.workflow }} failed
          BODY: ${{ github.repository }} ${{ github.ref_name }}
        run: |
          [ -n "$TOKEN" ] || { echo "PUSHOVER_TOKEN unset; not notifying"; exit 0; }
          curl -fsS --form-string "token=$TOKEN" --form-string "user=$USER" \
            --form-string "title=$TITLE" --form-string "message=$BODY $LINK" \
            https://api.pushover.net/1/messages.json
