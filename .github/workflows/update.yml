# Nightly pin updater: one job per lane, each opening an auto-merging bump PR
# on the forge. Runs on Forgejo only — the schedule also fires on the GitHub
# mirror, where every job skips on the server guard. The CI_* variables are
# Woodpecker's names, kept because the python they feed is unchanged.
#
# The job's own ephemeral token is the credential: measured on this instance,
# pushes made with it DO trigger workflows (Forgejo did not copy GitHub's
# loop suppression), so bump PRs still get their required checks.
name: update
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  network:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the network pin
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          CI_FORGE_URL: ${{ github.server_url }}
          CI_REPO: ${{ github.repository }}
          CI_REPO_CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" run -p 3.13 unifi-containers update stable
  unifi-os:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the UOS pins
        env:
          FORGEJO_TOKEN: ${{ github.token }}
          CI_FORGE_URL: ${{ github.server_url }}
          CI_REPO: ${{ github.repository }}
          CI_REPO_CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" run -p 3.13 unifi-containers update uos
