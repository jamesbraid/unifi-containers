# Nightly pin updater: one job per lane, each opening an auto-merging bump PR
# on the forge. Runs on Forgejo only — the schedule also fires on the GitHub
# mirror, where every job skips on the server guard. The CI_* variables are
# Woodpecker's names, kept because the python they feed is unchanged.
#
# The credential comes from UNIFI_BOT_TOKEN, not the job's own token, and not
# from a secret called FORGEJO_TOKEN: this Forgejo rejects the FORGEJO_, GITEA_
# and GITHUB_ prefixes outright, so that secret could never be created and the
# expression quietly resolved to an empty string every night. The built-in token can push and can
# open a PR, but nothing it pushes fires a pull_request run — so a bump PR
# opened with it carries no checks, never satisfies branch protection, and
# never automerges. Measured the hard way: the 5.1.42 bump sat open for two
# days with zero runs, and every following night's lane died trying to
# recreate a PR that already existed. The same branch pushed with this
# credential fired all three workflows within seconds.
name: update
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  network:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the network pin
        env:
          FORGEJO_TOKEN: ${{ secrets.UNIFI_BOT_TOKEN }}
          CI_FORGE_URL: ${{ github.server_url }}
          CI_REPO: ${{ github.repository }}
          CI_REPO_CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" run -p 3.13 unifi-containers update stable
  unifi-os:
    if: github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the UOS pins
        env:
          FORGEJO_TOKEN: ${{ secrets.UNIFI_BOT_TOKEN }}
          CI_FORGE_URL: ${{ github.server_url }}
          CI_REPO: ${{ github.repository }}
          CI_REPO_CLONE_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" run -p 3.13 unifi-containers update uos
