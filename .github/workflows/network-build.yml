name: network build

# The path lists are duplicated rather than shared with a YAML anchor:
# GitHub Actions does not reliably honour anchors in workflow files, and a
# silently-ignored trigger here means a broken image ships.
#
# src/unifi_runtime/** is load-bearing: the entrypoint and healthchecks
# now live in the shared package and are COPY'd into the image, so a change
# there changes the image without touching network/.
on:
  pull_request:
    paths:
      - "network/**"
      - "src/unifi_runtime/**"
      - "src/unifi_containers/**"
      - ".github/workflows/network-build.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/integration/**"
      - "tests/conftest.py"
  push:
    branches: [main]
    paths:
      - "network/**"
      - "src/unifi_runtime/**"
      - "src/unifi_containers/**"
      - ".github/workflows/network-build.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "tests/integration/**"
      - "tests/conftest.py"

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Plain `docker build` throughout: the sim build must resolve the
      # just-built base image from the local daemon, which the buildx
      # container driver cannot do.
      #
      # Root build context: the shared package lives at src/ and COPY cannot
      # reach outside its context. The sim variant keeps its small context —
      # it inherits the package and PYTHONPATH from the base image.
      - name: Build base image (amd64)
        run: docker build -f network/Dockerfile -t unifi-network:ci .

      # The tests run on uv's python-build-standalone; this runs on the
      # image's own interpreter, which is what actually executes in
      # production. It catches a module that will not import there at all.
      - name: Shipped package imports on the image's own interpreter
        run: docker run --rm --entrypoint /usr/bin/python3 unifi-network:ci -m unifi_runtime.selfcheck

      - name: Build sim image
        run: docker build --build-arg BASE_IMAGE=unifi-network:ci -t unifi-network:ci-sim network/sim/

      # One step, and the fixtures tear their containers down even when an
      # assertion fails -- which the previous boot/wait/rm sequence could not,
      # because `docker rm -f` was its own step and got skipped on failure.
      #
      # `-k network` keeps the UOS half out; `not seeded` keeps the seeded test
      # out too. Its image needs seed.tgz, which only a release run produces, so
      # selecting it here booted the last published seeded image instead.
      - name: Integration suite against the images just built
        env:
          UNIFI_TEST_NETWORK_IMAGE: unifi-network:ci
          UNIFI_TEST_NETWORK_SIM_IMAGE: unifi-network:ci-sim
        run: uv run -p 3.13 --extra test pytest tests/integration -m integration -k "network and not seeded"

  # A red run must page, not wait to be discovered: the 5.1.37 release
  # failure sat unnoticed for nine days until a consumer tripped over it.
  # Harmless while the PUSHOVER_* secrets are unset — the step says so and
  # exits clean.
  notify-failure:
    needs: [build-test]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          USER: ${{ secrets.PUSHOVER_USER }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ github.workflow }} failed
          BODY: ${{ github.repository }} ${{ github.ref_name }}
        run: |
          [ -n "$TOKEN" ] || { echo "PUSHOVER_TOKEN unset; not notifying"; exit 0; }
          curl -fsS --form-string "token=$TOKEN" --form-string "user=$USER" \
            --form-string "title=$TITLE" --form-string "message=$BODY $LINK" \
            https://api.pushover.net/1/messages.json
