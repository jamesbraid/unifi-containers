# DORMANT standby updater — the live update machinery runs on the canonical
# repo's CI (see .woodpecker/update.yml). This shadow driver exists so the
# whole update pipeline can move to GitHub by uncommenting the cron trigger
# below. Kept exercisable via workflow_dispatch.
name: unifi-os update (dormant)

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5

      - name: Run updater
        id: upd
        run: |
          out=$(uv run -p 3.13 unifi-containers bump-pins unifi-os --write)
          echo "$out"
          # bump-pins prints the version it selected, or nothing at all.
          if [ -n "$out" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$out" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open bump PR
        if: steps.upd.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app.outputs.token }}
          branch: bump/unifi-os-${{ steps.upd.outputs.version }}
          title: "unifi-os: bump to ${{ steps.upd.outputs.version }}"
          commit-message: "unifi-os: bump to ${{ steps.upd.outputs.version }}"
          committer: "unifi-containers updater <noreply@loreland.org>"
          author: "unifi-containers updater <noreply@loreland.org>"
          body: Automated UniFi OS Server update.
