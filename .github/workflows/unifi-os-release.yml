name: unifi-os release

on:
  push:
    tags: ["unifi-os/*"]

# GHCR pushes use the workflow token: GHCR does not honor GitHub App
# installation tokens for user-owned packages ("installation not allowed
# to Write organization package"). The App handles git/PR writes only.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jamesbraid/unifi-os-server
  # Per-arch images land here, never in the published package. `imagetools
  # create` copies the manifests AND their blobs into the target repository —
  # verified against a registry: the child manifest and its layers both resolve
  # under the target afterwards — so the published image does not depend on this
  # package surviving, and it can be thrown away.
  #
  # Pushing them into the published package instead is what left six permanent
  # `staging-*` tags per release: within one repository the pushed manifests ARE
  # the manifest-list children, so the tags cannot be removed without deleting
  # the image they point into.
  STAGING: ghcr.io/jamesbraid/unifi-os-server-staging

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Both matrix legs resolve these to the same strings, so which leg wins the
    # write does not matter.
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
      push_base: ${{ steps.ver.outputs.push_base }}
      push_sim: ${{ steps.ver.outputs.push_sim }}
      push_seeded: ${{ steps.ver.outputs.push_seeded }}
      globals: ${{ steps.ver.outputs.globals }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the plan compares against every release tag

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Fails here, at the first step, when the tag disagrees with the pinned
      # artifact — before anything is built, let alone pushed.
      - name: Plan the release
        id: ver
        run: uv run -p 3.13 unifi-containers release-plan "$GITHUB_REF_NAME" --github >> "$GITHUB_OUTPUT"

      # Nothing below runs for a superseded build. The push targets it would
      # interpolate are blank by then, so all three variants would collapse onto
      # one tag and collide after the builds had already run.
      - name: Refuse to publish a superseded build
        if: steps.ver.outputs.publish != 'true'
        run: echo "::notice::${GITHUB_REF_NAME} is not the newest build of its upstream version; nothing to publish"

      - name: Free disk space
        if: steps.ver.outputs.publish == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Extract UOS base image (pinned + sha256-verified)
        if: steps.ver.outputs.publish == 'true'
        run: uv run -p 3.13 unifi-containers extract-uos ${{ matrix.arch }}

      # The default docker driver, deliberately: the base is extracted from the
      # vendor installer and `docker load`ed, and a docker-container builder
      # cannot read the local image store — it tries to pull `uos-base:local`
      # from docker.io and fails.
      #
      # Root context for the base: the shared python package lives at src/ and
      # COPY cannot reach outside its context. sim/seeded keep their small
      # contexts — they inherit the package and PYTHONPATH from the base.
      - name: Build base, sim, and seeded images
        if: steps.ver.outputs.publish == 'true'
        run: |
          docker build -f unifi-os/Dockerfile \
            --build-arg UOS_VERSION="${{ steps.ver.outputs.build }}" \
            --build-arg REVISION="${GITHUB_SHA}" -t uos:base .
          docker build --build-arg BASE_IMAGE=uos:base -t uos:sim unifi-os/sim/
          docker build --build-arg BASE_IMAGE=uos:base -t uos:seeded unifi-os/seeded/

      - name: Shipped package imports on the image's own interpreter
        if: steps.ver.outputs.publish == 'true'
        run: docker run --rm --entrypoint /usr/bin/python3 uos:base -m unifi_runtime.selfcheck

      # Same drift check as the build workflow: ubnt-tools has moved its model
      # source between UOS releases; fail here in seconds, with the filename,
      # not in the boot suite half an hour in.
      - name: Vendor tooling can read the stamps
        if: steps.ver.outputs.publish == 'true'
        run: docker run --rm --entrypoint /usr/bin/python3 uos:base -m unifi_runtime.vendorcheck

      # Native, on this arch's own runner: an arm64 image is booted on an arm64
      # machine rather than trusted. The suite boots each variant under the
      # documented runtime contract and tears it down even when an assertion
      # fails. Nothing has been pushed anywhere at this point.
      - name: Health gate all three variants (native) — a broken image never publishes
        if: steps.ver.outputs.publish == 'true'
        env:
          UNIFI_TEST_UOS_IMAGE: uos:base
          UNIFI_TEST_UOS_SIM_IMAGE: uos:sim
          UNIFI_TEST_UOS_SEEDED_IMAGE: uos:seeded
        run: uv run -p 3.13 --extra test pytest tests/integration -m integration -k uos

      - name: Log in to GHCR
        if: steps.ver.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the gated images to the staging package
        if: steps.ver.outputs.publish == 'true'
        run: |
          set -euo pipefail
          for variant in base sim seeded; do
            docker tag "uos:$variant" "$STAGING:$variant-${{ matrix.arch }}"
            docker push "$STAGING:$variant-${{ matrix.arch }}"
          done

  manifest:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # slide-tags points names at digests, so the stitched manifest-list digest
      # has to come back out of the registry once each list exists.
      - name: Stitch multi-arch tags from the staged per-arch images
        id: stitch
        run: |
          set -euo pipefail
          stitch() {   # stitch <variant> <published-tag>: create the list, print its digest
            local digest
            # >&2 because only the digest line may reach $GITHUB_OUTPUT.
            docker buildx imagetools create -t "$IMAGE:$2" \
              "$STAGING:$1-amd64" "$STAGING:$1-arm64" >&2
            # An assignment, not an echo substitution: this has to fail the step
            # rather than hand slide-tags an empty digest it would only skip.
            digest=$(docker buildx imagetools inspect "$IMAGE:$2" \
              --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            echo "$1=$digest"
          }
          {
            stitch base   "${{ needs.build.outputs.push_base }}"
            stitch sim    "${{ needs.build.outputs.push_sim }}"
            stitch seeded "${{ needs.build.outputs.push_seeded }}"
          } >> "$GITHUB_OUTPUT"

      # The staging package is deleted below, so the published image has to be
      # standing on its own copies by now. imagetools does copy cross-repository,
      # but proving it here is the difference between deleting staging safely and
      # deleting the images out from under the tags.
      - name: Prove the published images do not depend on the staging package
        env:
          TAGS: >-
            ${{ needs.build.outputs.push_base }}
            ${{ needs.build.outputs.push_sim }}
            ${{ needs.build.outputs.push_seeded }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys

          image = os.environ["IMAGE"]

          def inspect(ref):
              out = subprocess.run(
                  ["docker", "buildx", "imagetools", "inspect", ref, "--raw"],
                  capture_output=True, text=True,
              )
              if out.returncode != 0:
                  sys.exit(f"{ref} does not resolve: {out.stderr.strip()[:200]}")
              return json.loads(out.stdout)

          for tag in os.environ["TAGS"].split():
              children = [m["digest"] for m in inspect(f"{image}:{tag}").get("manifests", [])]
              if not children:
                  sys.exit(f"{image}:{tag} has no child manifests")
              for digest in children:
                  # Resolving by digest against the PUBLISHED repository is the
                  # check: it succeeds only if the manifest was copied there.
                  inspect(f"{image}@{digest}")
              print(f"  {tag}: {len(children)} children resolve under the published package")
          PY

      # Which tags move was decided by release-plan; this only applies it.
      - name: Move the sliding tags
        run: |
          uv run -p 3.13 unifi-containers slide-tags --image "$IMAGE" \
            --tags "${{ needs.build.outputs.globals }}" \
            --base "${{ steps.stitch.outputs.base }}" \
            --sim "${{ steps.stitch.outputs.sim }}" \
            --seeded "${{ steps.stitch.outputs.seeded }}"

      # Best effort, and last: the release is already complete and verified
      # self-contained by here. A token without delete rights leaves a tidy-up
      # job behind, not a broken release.
      - name: Discard the staging package
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE /user/packages/container/unifi-os-server-staging \
            && echo "staging package deleted" \
            || echo "::warning::could not delete the staging package; it holds no published image"

  # A red run must page, not wait to be discovered: the 5.1.37 release
  # failure sat unnoticed for nine days until a consumer tripped over it.
  # Harmless while the PUSHOVER_* secrets are unset — the step says so and
  # exits clean.
  notify-failure:
    needs: [build, manifest]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          USER: ${{ secrets.PUSHOVER_USER }}
          LINK: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ github.workflow }} failed
          BODY: ${{ github.repository }} ${{ github.ref_name }}
        run: |
          [ -n "$TOKEN" ] || { echo "PUSHOVER_TOKEN unset; not notifying"; exit 0; }
          curl -fsS --form-string "token=$TOKEN" --form-string "user=$USER" \
            --form-string "title=$TITLE" --form-string "message=$BODY $LINK" \
            https://api.pushover.net/1/messages.json
