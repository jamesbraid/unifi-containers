name: unifi-os release

on:
  push:
    tags: ["unifi-os/*"]

# GHCR pushes use the workflow token: GHCR does not honor GitHub App
# installation tokens for user-owned packages ("installation not allowed
# to Write organization package"). The App handles git/PR writes only.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jamesbraid/unifi-os-server

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Both matrix legs resolve these to the same strings, so which leg wins the
    # write does not matter. The per-arch images are reached by their staging
    # tags instead, which are derived from push_base and so need no plumbing.
    outputs:
      publish: ${{ steps.ver.outputs.publish }}
      push_base: ${{ steps.ver.outputs.push_base }}
      push_sim: ${{ steps.ver.outputs.push_sim }}
      push_seeded: ${{ steps.ver.outputs.push_seeded }}
      globals: ${{ steps.ver.outputs.globals }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # the plan compares against every release tag

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Fails here, at the first step, when the tag disagrees with the pinned
      # artifact — before anything is built, let alone pushed.
      - name: Plan the release
        id: ver
        run: uv run -p 3.13 unifi-containers release-plan "$GITHUB_REF_NAME" --github >> "$GITHUB_OUTPUT"

      # Nothing below runs for a superseded build. The push targets it would
      # interpolate are blank by then, so all three variants would collapse onto
      # one `staging--<arch>` tag and collide after the builds had already run.
      - name: Refuse to publish a superseded build
        if: steps.ver.outputs.publish != 'true'
        run: echo "::notice::${GITHUB_REF_NAME} is not the newest build of its upstream version; nothing to publish"

      - name: Free disk space
        if: steps.ver.outputs.publish == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Extract UOS base image (pinned + sha256-verified)
        if: steps.ver.outputs.publish == 'true'
        run: uv run -p 3.13 unifi-containers extract-uos ${{ matrix.arch }}

      # Root context for the base: the shared python package lives at src/ and
      # COPY cannot reach outside its context. sim/seeded keep their small
      # contexts — they inherit the package and PYTHONPATH from the base.
      - name: Build base, sim, and seeded images
        if: steps.ver.outputs.publish == 'true'
        run: |
          base="$IMAGE:staging-${{ steps.ver.outputs.push_base }}-${{ matrix.arch }}"
          docker build -f unifi-os/Dockerfile \
            --build-arg UOS_VERSION="${{ steps.ver.outputs.build }}" \
            --build-arg REVISION="${GITHUB_SHA}" -t "$base" .
          docker build --build-arg BASE_IMAGE="$base" \
            -t "$IMAGE:staging-${{ steps.ver.outputs.push_sim }}-${{ matrix.arch }}" unifi-os/sim/
          docker build --build-arg BASE_IMAGE="$base" \
            -t "$IMAGE:staging-${{ steps.ver.outputs.push_seeded }}-${{ matrix.arch }}" unifi-os/seeded/

      - name: Shipped package imports on the image's own interpreter
        if: steps.ver.outputs.publish == 'true'
        run: |
          docker run --rm --entrypoint /usr/bin/python3 \
            "$IMAGE:staging-${{ steps.ver.outputs.push_base }}-${{ matrix.arch }}" \
            -m unifi_runtime.selfcheck

      # The suite boots each variant under the documented runtime contract and
      # tears it down even when an assertion fails.
      - name: Health gate all three variants (native) — a broken image never publishes
        if: steps.ver.outputs.publish == 'true'
        env:
          UNIFI_TEST_UOS_IMAGE: ${{ env.IMAGE }}:staging-${{ steps.ver.outputs.push_base }}-${{ matrix.arch }}
          UNIFI_TEST_UOS_SIM_IMAGE: ${{ env.IMAGE }}:staging-${{ steps.ver.outputs.push_sim }}-${{ matrix.arch }}
          UNIFI_TEST_UOS_SEEDED_IMAGE: ${{ env.IMAGE }}:staging-${{ steps.ver.outputs.push_seeded }}-${{ matrix.arch }}
        run: uv run -p 3.13 --extra test pytest tests/integration -m integration -k uos

      - name: Log in to GHCR
        if: steps.ver.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the per-arch staging images
        if: steps.ver.outputs.publish == 'true'
        run: |
          docker push "$IMAGE:staging-${{ steps.ver.outputs.push_base }}-${{ matrix.arch }}"
          docker push "$IMAGE:staging-${{ steps.ver.outputs.push_sim }}-${{ matrix.arch }}"
          docker push "$IMAGE:staging-${{ steps.ver.outputs.push_seeded }}-${{ matrix.arch }}"

  manifest:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # slide-tags points names at digests, so the stitched manifest-list digest
      # has to come back out of the registry once each list exists.
      - name: Stitch multi-arch tags
        id: stitch
        run: |
          set -o pipefail
          stitch() {   # stitch <variant> <tag>: create the list, print its digest
            local digest
            # >&2 because only the digest line may reach $GITHUB_OUTPUT.
            docker buildx imagetools create -t "$IMAGE:$2" \
              "$IMAGE:staging-$2-amd64" "$IMAGE:staging-$2-arm64" >&2
            # An assignment, not an echo substitution: this has to fail the step
            # rather than hand slide-tags an empty digest it would only skip.
            digest=$(docker buildx imagetools inspect "$IMAGE:$2" \
              --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            echo "$1=$digest"
          }
          {
            stitch base   "${{ needs.build.outputs.push_base }}"
            stitch sim    "${{ needs.build.outputs.push_sim }}"
            stitch seeded "${{ needs.build.outputs.push_seeded }}"
          } >> "$GITHUB_OUTPUT"

      # Which tags move was decided by release-plan; this only applies it.
      - name: Move the sliding tags
        run: |
          uv run -p 3.13 unifi-containers slide-tags --image "$IMAGE" \
            --tags "${{ needs.build.outputs.globals }}" \
            --base "${{ steps.stitch.outputs.base }}" \
            --sim "${{ steps.stitch.outputs.sim }}" \
            --seeded "${{ steps.stitch.outputs.seeded }}"
