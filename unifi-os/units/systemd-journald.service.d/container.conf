# The stock unit's CapabilityBoundingSet names capabilities the container
# contract does not grant (SYSLOG, AUDIT_*, MAC_OVERRIDE), and applying any
# bounding set needs SETPCAP, which the contract also withholds — so systemd
# kills journald at exec with 218/CAPABILITIES and every unit's stdout/stderr
# is lost. That silence is how a crash-looping service ships: the 5.1.37
# unifi-core regression produced literally no output anywhere.
#
# `~` is the inverted empty set: apply no bounding-set restriction at all.
# (A bare empty assignment is the opposite — it resets to the EMPTY set.)
# The container's own cap set still bounds the process; journald runs fine
# under it when systemd doesn't try to shrink it further.
[Service]
CapabilityBoundingSet=~
