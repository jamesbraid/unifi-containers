# UniFi OS Server test-target usage. systemd runs as PID 1, so the
# container needs this exact contract: the cap list (no privileged mode),
# host cgroup namespace with /sys/fs/cgroup rw, and the tmpfs set.
# TAG=sim boots straight into a demo controller (admin/admin, seeded demo
# devices, no wizard); `docker compose up --wait` returns when the bundled
# Network Application answers a real API login on :8443.
services:
  unifi-os:
    image: ghcr.io/jamesbraid/unifi-os-server:${TAG:-sim}
    cgroup: host
    cap_drop: [ALL]
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - CHOWN
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
      - AUDIT_WRITE
      - MKNOD
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - unifi_os:/unifi
    ports:
      - "11443:443"       # UOS GUI/API (ucore, behind SSO)
      - "7443:7443"       # bundled Network app API, direct (no SSO; UOS_NETWORK_DIRECT, on in sim)
      - "8080:8080"       # device inform
      - "3478:3478/udp"   # STUN
      - "10003:10003/udp" # discovery

volumes:
  unifi_os:
