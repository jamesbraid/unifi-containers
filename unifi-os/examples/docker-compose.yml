# UniFi OS Server test-target usage. systemd runs as PID 1, so the
# container needs this exact contract: the cap list (no privileged mode),
# host cgroup namespace with /sys/fs/cgroup rw, and the tmpfs set.
#
# Two ready-to-test variants (`docker compose up --wait` returns when healthy):
#   TAG=sim    — Network App demo: admin/admin + seeded demo devices on the
#                direct Network API port 7443 (plain HTTP -> :8081). The UOS
#                ucore API (:443) is left unconfigured in this variant.
#                Login: curl -X POST -d '{"username":"admin","password":"admin"}' \
#                  http://localhost:7443/api/login
#   TAG=seeded — UOS-native: headless-seeded Owner admin on the UOS ucore API
#                (:443), no wizard, no cloud, no demo devices.
#                Login: curl -ksX POST -d '{"username":"admin","password":"admin"}' \
#                  https://localhost:11443/api/auth/login
services:
  unifi-os:
    image: ghcr.io/jamesbraid/unifi-os-server:${TAG:-sim}
    cgroup: host
    cap_drop: [ALL]
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - CHOWN
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
      - AUDIT_WRITE
      - MKNOD
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - unifi_os:/unifi
    ports:
      - "11443:443"       # UOS GUI/API (ucore, behind SSO)
      - "7443:7443"       # bundled Network app API, direct (no SSO; UOS_NETWORK_DIRECT, on in sim)
      - "8080:8080"       # device inform
      - "3478:3478/udp"   # STUN
      - "10003:10003/udp" # discovery

volumes:
  unifi_os:
