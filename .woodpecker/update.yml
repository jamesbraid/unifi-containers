when:
  - event: cron
  - event: manual

# The lanes talk to the forge over pyforgejo and unpack the deb with
# python-debian, so the image needs nothing added: no curl, jq, binutils, xz,
# unzip, tar, and no git either, since pygit2 carries its own transport.
steps:
  update-stable:
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_ci_token
    commands:
      - uv run -p 3.13 unifi-containers update stable

  update-uos:
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_ci_token
    commands:
      - uv run -p 3.13 unifi-containers update uos
