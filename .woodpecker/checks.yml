when:
  - event: pull_request
  - event: push
    branch: [main, rc]
  - event: manual

steps:
  updater-tests:
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    commands:
      - uv run --with pytest pytest scripts/tests/ -q

  verify-pins:
    # Format + reachability only. Monotonicity is enforced where bumps are
    # SELECTED (the updaters check against external channel authorities);
    # fetching the target branch here would need repo auth on PR events,
    # which the clone credentials don't survive to provide.
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    commands:
      - python3 scripts/unifi-network-updater.py --verify
      - python3 scripts/unifi-os-updater.py --verify
