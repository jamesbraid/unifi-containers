when:
  - event: pull_request
  - event: push
    branch: [main, rc]
  - event: manual

# Two interpreters because the two packages carry different obligations.
# unifi_runtime is COPY'd into an image running Debian's python 3.9.2 with no
# pip, so tests/runtime must pass there. Everything else is CI tooling on 3.13.
steps:
  runtime-py39:
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    commands:
      - uv run -p 3.9 --no-project --with-requirements tests/runtime/requirements.txt pytest tests/runtime

  all-py313:
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    commands:
      - uv run -p 3.13 --extra test --extra dev pytest

  lint:
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    commands:
      # The `dev` extra, not `uvx`: ruff comes from the lockfile, so CI and a
      # laptop cannot disagree about which version decided the diff.
      - uv run -p 3.13 --extra dev ruff check .
      - uv run -p 3.13 --extra dev ruff format --check .

  workflows:
    # yaml.safe_load silently keeps the last of a duplicate key; GitHub rejects
    # the file outright. A duplicate `if:` here would have failed every network
    # release, and nothing in this pipeline could see it.
    image: rhysd/actionlint:latest
    commands:
      - actionlint .github/workflows/*.yml

  types:
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    commands:
      # check_untyped_defs, not strict: this finds bugs in unannotated code
      # without requiring annotations.
      - uv run -p 3.13 --extra dev mypy src/

  verify-pins:
    # Format and reachability only. Monotonicity is enforced where bumps are
    # SELECTED, against the external channel authorities.
    image: ghcr.io/astral-sh/uv:python3.13-alpine
    commands:
      - uv run -p 3.13 unifi-containers verify-pins
