# Publish on any release tag, however it was minted.
#
# The GitHub mirror is manual-sync, so a tag only reaches GitHub — and only
# then fires the release workflow that builds and pushes images — when
# something asks Forgejo to sync. Until now the single caller was
# mint-tag.sh, which runs on push-to-main and exits early unless HEAD is a
# bump commit. Rebuild releases (same upstream version, next packaging
# revision) are tagged by hand, so their tags stayed on Forgejo and nothing
# ever published. Trigger the sync from the tag event instead, which covers
# hand-cut and minted tags alike.
#
# mint-tag.sh still syncs after minting. That path is load-bearing for
# version bumps, and a second sync is idempotent, so it stays until a minted
# tag is observed firing this pipeline.
when:
  - event: tag

steps:
  sync-mirror:
    image: alpine/git
    environment:
      FORGEJO_TOKEN:
        from_secret: forgejo_ci_token
    commands:
      - apk add --no-cache curl
      - |
        curl -fsS -X POST -H "Authorization: token ${FORGEJO_TOKEN}" \
          "${CI_FORGE_URL}/api/v1/repos/${CI_REPO}/push_mirrors-sync"
      - echo "mirror sync triggered for ${CI_COMMIT_TAG}"
