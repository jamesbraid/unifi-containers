[project]
name = "unifi-containers"
version = "0.1.0"
description = "Version-pinned UniFi controller OCI images built as test targets, and the tooling that builds them"
readme = "README.md"
license = { text = "MIT" }
# This distribution is the host tooling: the CLI and the CI lanes. Its floor is
# the interpreter that runs them, and its dependencies are what the console
# script imports on the first line — declaring >=3.9 with no dependencies made
# `pip install` succeed and `unifi-containers` then die on `import typer`.
requires-python = ">=3.13"

dependencies = [
    "docker>=7.2",
    "feedparser>=6",
    "httpx>=0.28",
    "packaging>=24",
    "pyforgejo>=2",
    "pygit2>=1.19",
    "python-debian>=1.1",
    "python-dotenv>=1.2",
    "testcontainers>=4.15",
    "typer>=0.27",
]

# `unifi_runtime` is packaged too, because `testing` and `make_seed` import it on
# the host. That does not make it installable *into an image*: it gets there by
# COPY, onto Debian's python 3.9.2 with no pip, which is why it stays 3.9 syntax
# and stdlib-only however this distribution is built.
# tests/runtime/requirements.txt drives that lane, against src/ rather than an
# install, because an install is not how it ships.

[project.optional-dependencies]
# pytest-httpserver is pinned, not floated: 1.1.3 is the last release supporting
# 3.9, and both lanes run the same tests, so both must see the same behaviour.
test = [
    "pytest>=8",
    "pytest-httpserver==1.1.3",
    "pytest-timeout>=2.4",
    # For the duplicate-key check over the CI yaml, which actionlint only
    # performs for .github/workflows.
    "pyyaml>=6",
]

dev = [
    "mypy>=1.11",
    "ruff>=0.14",
]

[project.scripts]
unifi-containers = "unifi_containers.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# tests/runtime -> exercises unifi_runtime, must pass on the 3.9 image floor.
# tests/ci      -> CI tooling, 3.13 only.
# tests/integration -> drives real containers, so it is deselected by default.
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
    "integration: drives real containers; needs a docker daemon",
]
timeout = 300

[tool.ruff]
# 3.9 is the floor: `unifi_runtime` runs on Debian's python 3.9.2, which we do
# not control.
target-version = "py39"
# 100, not 88: the updater tests embed literal release URLs and README table rows
# that cannot be wrapped without making the fixture unreadable.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# These fixtures reproduce real README table rows and release URLs verbatim;
# wrapping them would stop them matching what the code parses.
"tests/ci/test_unifi_os_updater.py" = ["E501"]
"tests/ci/test_unifi_network_updater.py" = ["E501"]
# typer.Option()/Argument() in a default IS the typer idiom; B008 is wrong here.
"src/unifi_containers/cli.py" = ["B008"]

[tool.mypy]
# Find bugs without demanding annotations. check_untyped_defs is the setting that
# earns this: it type-checks the bodies of unannotated functions, which is what
# catches an Optional dereference in existing code.
check_untyped_defs = true
ignore_missing_imports = true
# Deliberately NOT set: disallow_untyped_defs, strict. Annotations stay optional.
